name: TraceCite document maintenance
description: Check Markdown file references, source-bound snippets, and reference baselines
inputs:
  path:
    description: Markdown file, directory or quoted glob relative to the caller repository root
    required: false
    default: ''
  config:
    description: Project configuration relative to the caller root; auto-detects tracecite.json
    required: false
  online:
    description: Also revisit HTTP/HTTPS sources; local checks are offline by default
    required: false
    default: ''
  strict:
    description: Fail when an apparent citation cannot be checked
    required: false
    default: ''
  baseline:
    description: Optional generated snapshot path relative to the caller repository root
    required: false
  exclude:
    description: Paths or glob patterns to exclude, one per line, relative to the caller repository root
    required: false
  report:
    description: Legacy report input; implies online checking and overrides path
    required: false
runs:
  using: composite
  steps:
    - name: Install MoonBit
      shell: bash
      run: |
        if ! command -v moon >/dev/null 2>&1; then
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
        fi
    - name: Check document references
      shell: bash
      env:
        TRACECITE_REPORT: ${{ inputs.report }}
        TRACECITE_PATH: ${{ inputs.path }}
        TRACECITE_CONFIG: ${{ inputs.config }}
        TRACECITE_ONLINE: ${{ inputs.online }}
        TRACECITE_STRICT: ${{ inputs.strict }}
        TRACECITE_BASELINE: ${{ inputs.baseline }}
        TRACECITE_EXCLUDE: ${{ inputs.exclude }}
      run: |
        cd "$GITHUB_ACTION_PATH"
        moon update
        bash scripts/run_document_action.sh
