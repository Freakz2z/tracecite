<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">TraceCite — 核对 Agent 引用与来源变化</title>
  <desc id="desc">左侧是项目名称与用途；右侧展示实际验证结果：IANA 网页引用匹配 1/1，同一来源在两次 Codex CLI 运行间发生变化。</desc>

  <rect width="1200" height="400" rx="20" fill="#101A1E"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="66" y="75" fill="#72DEC0" font-size="19" font-weight="700" letter-spacing="2.5">MOONBIT  /  AGENT EVIDENCE</text>
    <text x="62" y="173" fill="#F5F8F7" font-size="84" font-weight="760" letter-spacing="-2">TraceCite</text>
    <text x="66" y="235" fill="#E2EAE8" font-size="39" font-weight="600">核对引用原文</text>
    <text x="66" y="285" fill="#E2EAE8" font-size="39" font-weight="600">发现来源变化</text>
    <text x="67" y="356" fill="#9FB3B4" font-size="21">独立回源 · 逐字匹配 · 跨运行比较</text>
  </g>

  <g id="observed-results" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="654" y="47" width="482" height="306" rx="16" fill="#19282C" stroke="#40575A" stroke-width="2"/>
    <text x="691" y="89" fill="#9FB3B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" letter-spacing="1">01  LIVE SOURCE / IANA</text>
    <text x="691" y="137" fill="#F5F8F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">example.com and example.org</text>
    <path d="M691 160H1099" stroke="#40575A" stroke-width="2"/>
    <circle cx="701" cy="205" r="8" fill="#72DEC0"/>
    <text x="723" y="213" fill="#C6D7D4" font-size="22" font-weight="600">引用出现在当前网页</text>
    <text x="1043" y="215" fill="#72DEC0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700">1/1</text>
    <path d="M691 236H1099" stroke="#40575A" stroke-width="2"/>
    <text x="691" y="274" fill="#9FB3B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" letter-spacing="1">02  CODEX CLI / TWO RUNS</text>
    <text x="691" y="320" fill="#F5F8F7" font-size="24" font-weight="600">同一来源 URI</text>
    <text x="984" y="320" fill="#E9BD7A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">CHANGED</text>
  </g>
</svg>
