<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">TraceCite — Keep your docs in sync</title>
  <desc id="description">Illustrative check: a guide quotes timeout = 20 while its source contains timeout = 30. TraceCite points to the document line for review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101e2b"/>
      <stop offset="1" stop-color="#102a2c"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d2f7ee" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#background)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="56" y="51" width="33" height="33" rx="9" fill="#77e4c0" fill-opacity="0.12"/>
    <path d="M65 68l5 5 10-12" fill="none" stroke="#77e4c0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="73" fill="#8ddfc7" font-size="14" font-weight="700" letter-spacing="2">DOCUMENT REFERENCE MAINTENANCE</text>
    <text x="53" y="172" fill="#f4faf8" font-size="79" font-weight="750" letter-spacing="-3">TraceCite</text>
    <text x="57" y="222" fill="#c5e1da" font-size="31" font-weight="500">Keep your docs in sync.</text>
    <text x="58" y="265" fill="#92aca9" font-size="17">Files. Headings. Code excerpts. Source drift.</text>
    <rect x="57" y="305" width="143" height="27" rx="13.5" fill="#77e4c0" fill-opacity="0.10" stroke="#77e4c0" stroke-opacity="0.22"/>
    <text x="128" y="323" text-anchor="middle" fill="#a4ecd6" font-size="11" font-weight="600">OFFLINE BY DEFAULT</text>
    <text x="219" y="323" fill="#91b1ac" font-size="13">Built with MoonBit</text>

    <rect x="610" y="47" width="534" height="285" rx="16" fill="#101d28" stroke="#35524f"/>
    <circle cx="631" cy="69" r="3" fill="#557571"/>
    <circle cx="644" cy="69" r="3" fill="#557571"/>
    <circle cx="657" cy="69" r="3" fill="#557571"/>
    <text x="691" y="74" fill="#a8c7be" font-size="12" font-weight="600" letter-spacing="1.4">DOCUMENT → SOURCE</text>
    <text x="1121" y="74" text-anchor="end" fill="#658780" font-size="10" letter-spacing="1">EXAMPLE</text>
    <path d="M611 91h532" stroke="#2b4243"/>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
      <rect x="631" y="112" width="221" height="123" rx="9" fill="#162833" stroke="#2f4c51"/>
      <text x="647" y="138" fill="#a9c7cc" font-size="12">docs/guide.md</text>
      <path d="M632 150h219" stroke="#2f4c51"/>
      <text x="647" y="178" fill="#628b8e" font-size="11">12</text>
      <text x="670" y="178" fill="#eff5f4" font-size="14">timeout = <tspan fill="#f1c987">20</tspan></text>
      <text x="647" y="213" fill="#739a9a" font-size="10">source=config.toml</text>
      <path d="M863 174h18m-5-5 5 5-5 5" fill="none" stroke="#6bcbb1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="893" y="112" width="229" height="123" rx="9" fill="#142a2b" stroke="#31564f"/>
      <text x="909" y="138" fill="#a4cfc0" font-size="12">config.toml</text>
      <path d="M894 150h227" stroke="#31564f"/>
      <text x="909" y="178" fill="#eff5f4" font-size="14">timeout = <tspan fill="#7ae0bd">30</tspan></text>
      <text x="909" y="213" fill="#739f90" font-size="10">current source</text>
    </g>
    <rect x="631" y="256" width="491" height="53" rx="9" fill="#f1c987" fill-opacity="0.07" stroke="#f1c987" stroke-opacity="0.25"/>
    <circle cx="652" cy="282" r="8" fill="none" stroke="#f1c987" stroke-width="1.5"/>
    <path d="M652 278v5m0 3v.1" stroke="#f1c987" stroke-width="1.5" stroke-linecap="round"/>
    <text x="671" y="287" fill="#f1d9ae" font-size="14" font-weight="600">Source changed. Review the document line.</text>
  </g>
</svg>
