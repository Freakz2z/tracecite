name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit toolchain
        run: |
          moon version
          moonc -v
          python3 - <<'PY'
          import re
          import subprocess

          version = subprocess.check_output(["moonc", "-v"], text=True).strip()
          match = re.search(r"v?(\d+)\.(\d+)\.(\d+)", version)
          if match is None or tuple(map(int, match.groups())) < (0, 10, 14):
              raise SystemExit(f"moonc >= 0.10.14 required, got {version}")
          PY
      - name: Check
        run: |
          moon update
          moon check --deny-warn
      - name: Build
        run: |
          moon build --deny-warn
          moon build --target js --deny-warn
          moon build --target wasm --deny-warn
      - name: Test and run examples
        run: |
          moon test --deny-warn
          moon test --target js --deny-warn
          moon test --target wasm --deny-warn
          sh scripts/smoke.sh
          moon run cmd/main verify-notes fixtures/simple-citation.md
          moon run cmd/main check-report examples/report.md
          moon run cmd/main check-report examples/inline-report.md
          moon run cmd/main check-report examples/title-first-report.md
          moon run cmd/main verify-urls fixtures/web-source-trace.jsonl
      - name: Exercise public report action
        uses: ./
        with:
          report: examples/inline-report.md
      - name: Exercise tagged report action
        uses: Freakz2z/tracecite@v0.4.0
        with:
          report: examples/title-first-report.md
      - name: Check Codex CLI event adapter
        run: |
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 adapters/codex_cli.py fixtures/codex-cli-events.jsonl --out /tmp/codex-trace.jsonl
          cmp fixtures/codex-cli-trace.jsonl /tmp/codex-trace.jsonl
          moon run cmd/main /tmp/codex-trace.jsonl --evidence
          python3 adapters/codex_cli.py fixtures/codex-cli-events.jsonl --bind source-1=fixtures/facts.txt --out /tmp/codex-file-trace.jsonl
          cmp fixtures/codex-cli-file-trace.jsonl /tmp/codex-file-trace.jsonl
          moon run cmd/main verify-files /tmp/codex-file-trace.jsonl
