name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit toolchain
        run: |
          moon version
          moonc -v
          python3 - <<'PY'
          import re
          import subprocess

          version = subprocess.check_output(["moonc", "-v"], text=True).strip()
          # Review toolchain upgrades separately before formatter/API migration.
          if not version.startswith("v0.10.15+943464bfa "):
              raise SystemExit(f"Unreviewed compiler drift: {version}; expected v0.10.15+943464bfa")
          moon_version = subprocess.check_output(["moon", "version"], text=True).strip()
          if not moon_version.startswith("moon 0.1.20261012 (748b63c "):
              raise SystemExit(f"Unreviewed moon drift: {moon_version}")
          match = re.search(r"v?(\d+)\.(\d+)\.(\d+)", version)
          if match is None or tuple(map(int, match.groups())) < (0, 10, 15):
              raise SystemExit(f"moonc >= 0.10.15 required, got {version}")
          PY
      - name: Check
        run: |
          moon update
          moon info
          moon fmt
          git diff --exit-code -- '*.mbti' '*.mbt'
          moon check --deny-warn
      - name: Build
        run: |
          moon build --deny-warn
          moon build --target js --deny-warn
          moon build --target wasm --deny-warn
      - name: Test and run examples
        run: |
          moon test --deny-warn
          moon test --target js --deny-warn
          moon test --target wasm --deny-warn
          sh scripts/smoke.sh
          python3 scripts/test_document_cli.py
          python3 scripts/test_report_contract.py
          python3 scripts/consistency_demo.py --out _build/acceptance/consistency-ci
          python3 scripts/generate_unicode_punctuation.py --check
          python3 scripts/generate_unicode_case.py --check
          python3 scripts/generate_unicode_casefold.py --check
          moon run cmd/main check
          moon run cmd/main check --root examples/quote-policy/project
          moon run cmd/main check guide.md --root examples/anchors/project --no-config --strict
          moon run cmd/main check guide.md --root examples/link-parsing/project --no-config --strict
          moon run cmd/main check guide.md --root examples/compatibility/project --no-config --strict
          moon run cmd/main check guide.md --root examples/maintenance/project --no-config --strict
          moon run cmd/main verify-notes fixtures/simple-citation.md
          moon run cmd/main check-report examples/report.md
          moon run cmd/main check-report examples/inline-report.md
          moon run cmd/main check-report examples/title-first-report.md
          moon run cmd/main verify-urls fixtures/web-source-trace.jsonl
      - name: Reproduce offline maintenance acceptance case
        run: |
          python3 scripts/acceptance_demo.py --out _build/acceptance/ci
          python3 scripts/maintenance_review_demo.py --out _build/acceptance/review-ci
          python3 scripts/engineering_demo.py --out _build/acceptance/engineering-ci
          python3 scripts/test_native_package.py
          python3 scripts/test_release.py
      - name: Exercise shared-config onboarding
        run: python3 scripts/onboarding_demo.py --out _build/acceptance/onboarding-ci
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tracecite-acceptance-evidence
          path: |
            _build/acceptance/ci/
            _build/acceptance/review-ci/
            _build/acceptance/engineering-ci/
            _build/acceptance/consistency-ci/
            _build/acceptance/onboarding-ci/
          if-no-files-found: error
      - name: Exercise public report action
        uses: ./
        with:
          report: examples/inline-report.md
      - name: Maintain repository documentation
        uses: ./
      - name: Exercise tagged report action
        uses: Freakz2z/tracecite@v0.4.0
        with:
          report: examples/title-first-report.md
      - name: Check Codex CLI event adapter
        run: |
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 adapters/codex_cli.py fixtures/codex-cli-events.jsonl --out /tmp/codex-trace.jsonl
          cmp fixtures/codex-cli-trace.jsonl /tmp/codex-trace.jsonl
          moon run cmd/main /tmp/codex-trace.jsonl --evidence
          python3 adapters/codex_cli.py fixtures/codex-cli-events.jsonl --bind source-1=fixtures/facts.txt --out /tmp/codex-file-trace.jsonl
          cmp fixtures/codex-cli-file-trace.jsonl /tmp/codex-file-trace.jsonl
          moon run cmd/main verify-files /tmp/codex-file-trace.jsonl
      - name: Verify Mooncakes release archive and public API consumers
        run: bash scripts/release.sh --package-only
      - uses: actions/upload-artifact@v6
        with:
          name: tracecite-mooncakes-candidate
          path: dist/mooncakes/*
          if-no-files-found: error
