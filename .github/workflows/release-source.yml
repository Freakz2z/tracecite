name: Verify and attach published source

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the published Mooncakes version
        required: true
        type: string

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_guard.py
          mkdir -p _build/release-source
          gh release download "$RELEASE_TAG" --pattern release-assets.json --dir _build/release-source
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('_build/release-source/release-assets.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if manifest['tag'] != os.environ['RELEASE_TAG'] or manifest['revision'] != head:
              raise SystemExit('Release assets do not match the selected tag')
          PY
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify source ZIP and actual registry consumers
        run: |
          moon update
          python3 - <<'PY'
          import hashlib
          import sys
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          sys.path.insert(0, 'scripts')
          from verify_release_package import module_metadata, registry_module

          metadata = module_metadata(Path('moon.mod').read_text())
          published = registry_module(metadata)
          url = 'https://download.mooncakes.io/user/' + quote(metadata['name'], safe='/') + '/' + metadata['version'] + '.zip'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive = response.read()
          if hashlib.sha256(archive).hexdigest() != published['metadata']['checksum']:
              raise SystemExit('Downloaded archive differs from the registry checksum')
          destination = Path('_build/publish') / (metadata['name'].replace('/', '-') + '-' + metadata['version'] + '.zip')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(archive)
          PY
          python3 scripts/verify_release_package.py
          python3 scripts/verify_release_package.py --consume-registry
      - name: Attach verified source and receipts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/mooncakes/*.zip dist/mooncakes/*.sha256 dist/mooncakes/*.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tracecite-published-source-evidence
          path: |
            dist/mooncakes/*
            _build/acceptance/published-*/
          if-no-files-found: warn
