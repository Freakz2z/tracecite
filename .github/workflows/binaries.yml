name: Native CLI packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build standalone CLI package
        run: |
          moon update
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/release_guard.py --expected-revision "$GITHUB_SHA"
          fi
          bash scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: tracecite-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: tracecite-*
          path: dist/release
          merge-multiple: true
      - name: Verify identity and prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare_github_release.py dist/release --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "TraceCite $GITHUB_REF_NAME" --notes-file dist/release/RELEASE-NOTES.md \
            dist/release/*.tar.gz dist/release/*.sha256 dist/release/release-assets.json
